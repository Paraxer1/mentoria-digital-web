name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio sin Git LFS
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Validar estructura y enlaces internos
        run: python3 scripts/validate-site.py

      - name: Preparar el sitio estático
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='*.exe' \
            --exclude='*.deb' \
            --exclude='*.msi' \
            --exclude='*.AppImage' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='datos.json' \
            --exclude='datos.json.corrupto-*' \
            --exclude='data/*.sqlite' \
            --exclude='data/*.sqlite-*'
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
